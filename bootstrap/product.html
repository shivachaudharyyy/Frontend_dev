<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Catalog</title>
  <!-- ✅ Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-5 fw-bold">Our Products</h2>
    <div class="row g-4">
      
      <!-- 🧱 Product Card -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 1">
          <div class="card-body text-center">
            <h5 class="card-title">Product One</h5>
            <p class="card-text text-muted">$29.99</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <!-- Repeat for more products -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 2">
          <div class="card-body text-center">
            <h5 class="card-title">Product Two</h5>
            <p class="card-text text-muted">$39.99</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 3">
          <div class="card-body text-center">
            <h5 class="card-title">Product Three</h5>
            <p class="card-text text-muted">$49.99</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product 4">
          <div class="card-body text-center">
            <h5 class="card-title">Product Four</h5>
            <p class="card-text text-muted">$59.99</p>
            <a href="#" class="btn btn-primary btn-sm">Add to Cart</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 📦 Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
