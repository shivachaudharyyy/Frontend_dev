<section class="container py-5">
  <div class="card p-4">
    <h3 class="fw-bold mb-4">🔔 Notifications</h3>

    <!-- ✅ Alerts -->
    <div class="alert alert-success">✅ New message received!</div>
    <div class="alert alert-info">💡 Tip: Use keyboard shortcuts to save time.</div>
    <div class="alert alert-danger">⚠️ Warning: Storage nearing limit.</div>

    <!-- ❌ Dismissible Alert -->
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      <strong>Heads up!</strong> Your profile is incomplete.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 📊 Summary Well -->
    <div class="bg-light border rounded p-3 mt-4">
      <h5 class="fw-bold">Summary</h5>
      <p>You have 3 active alerts and 1 pending action.</p>
    </div>
  </div>
</section>
