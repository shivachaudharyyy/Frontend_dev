<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Portfolio</title>
  <!-- ✅ Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

  <!-- 🧢 Header Section -->
  <header class="text-center p-5">
    <h1 class="fw-bold mb-3">Mayank Yadav</h1>
    <p class="lead">Web Developer | UI/UX Enthusiast | ML Explorer</p>
  </header>

  <!-- 🖼️ Profile Image -->
  <div class="container text-center mt-4">
    <img src="https://via.placeholder.com/150" alt="Profile" class="img-fluid rounded-circle mb-3" width="150" height="150">
    
    <!-- 🎯 Action Buttons -->
    <div class="mb-4">
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary">Download CV</a>
    </div>
  </div>

  <!-- 📬 Contact Form -->
  <div class="container text-center mt-4">
    <h4 class="fw-bold mb-3">Contact Me</h4>
    <form class="mx-auto" style="max-width: 500px;">
      <input type="text" class="form-control mb-3" placeholder="Your Name">
      <input type="email" class="form-control mb-3" placeholder="Your Email">
      <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>
      <button type="submit" class="btn btn-success">Send Message</button>
    </form>
  </div>

  <!-- 📦 Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
