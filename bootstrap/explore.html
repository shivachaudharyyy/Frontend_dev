<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Destinations</title>
  <!-- ✅ Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- 🖼️ Carousel -->
  <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="3000">
        <img src="https://via.placeholder.com/1200x400?text=Paris" class="d-block w-100" alt="Paris">
        <div class="carousel-caption d-none d-md-block">
          <h5>Paris, France</h5>
          <p>Romantic escapes and iconic landmarks.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="https://via.placeholder.com/1200x400?text=Bali" class="d-block w-100" alt="Bali">
        <div class="carousel-caption d-none d-md-block">
          <h5>Bali, Indonesia</h5>
          <p>Tropical paradise and serene beaches.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="5000">
        <img src="https://via.placeholder.com/1200x400?text=New+York" class="d-block w-100" alt="New York">
        <div class="carousel-caption d-none d-md-block">
          <h5>New York, USA</h5>
          <p>The city that never sleeps.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- 📊 Booking Progress -->
  <div class="container my-5">
    <h4 class="text-center fw-bold mb-3">Booking Completion</h4>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 70%;">
        70%
      </div>
    </div>
  </div>

  <!-- 📞 Footer -->
  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-1">Contact Us: +91-9876543210 | travel@agency.com</p>
    <p class="mb-0">&copy; 2025 Explore Destinations. All rights reserved.</p>
  </footer>

  <!-- 📦 Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
