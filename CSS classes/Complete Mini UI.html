<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q10 — Mini UI Layout</title>
  <link rel="stylesheet" href="Complete Mini UI.css">
</head>
<body>
  <header class="site-header"><h1>My App</h1></header>
  <main class="center">
    <section class="card">
      <img src="https://picsum.photos/seed/pic1/120/120" alt="avatar" class="avatar">
      <form class="form">
        <label>
          Name
          <input type="text" placeholder="Your name">
        </label>
        <label>
          Email
          <input type="email" placeholder="you@example.com">
        </label>
        <div class="row">
          <button class="primary">Submit</button>
          <button type="button" class="ghost">Cancel</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer">© 2025 Mini UI</footer>
</body>
</html>
