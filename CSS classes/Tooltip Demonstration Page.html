<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q2 — Tooltip Demo</title>
  <link rel="stylesheet" href="Tooltip Demonstration Page.css">
</head>
<body>
  <main class="center">
    <h1>CSS Tooltips</h1>
    <section class="icons">
      <div class="tip">
        <span class="target">🔍</span>
        <span class="tooltip">Search the site</span>
      </div>

      <div class="tip">
        <span class="target">💬</span>
        <span class="tooltip">Open chat</span>
      </div>

      <div class="tip">
        <span class="target">⚙️</span>
        <span class="tooltip">Settings</span>
      </div>
    </section>
  </main>
</body>
</html>
