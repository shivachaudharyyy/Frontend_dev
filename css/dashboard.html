<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #333;
      color: white;
      padding: 1em;
      text-align: center;
      z-index: 1000;
    }
    .container {
      display: flex;
      margin-top: 60px;
      min-height: calc(100vh - 60px);
    }
    nav {
      background: #f0f0f0;
      width: 200px;
      padding: 1em;
    }
    main {
      flex: 1;
      padding: 2em;
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
    }
    .box {
      background: white;
      flex: 1 1 300px;
      padding: 1em;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 5px;
    }
    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }
      nav {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header><h1>Dashboard</h1></header>
  <div class="container">
    <nav>
      <p><a href="#">Home</a></p>
      <p><a href="#">Reports</a></p>
      <p><a href="#">Settings</a></p>
    </nav>
    <main>
      <div class="box">Content Box 1</div>
      <div class="box">Content Box 2</div>
    </main>
  </div>
</body>
</html>
