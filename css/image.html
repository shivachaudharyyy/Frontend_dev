<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1em;
      padding: 2em;
    }
    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .photo img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease;
    }
    .photo:hover img {
      transform: scale(1.1);
    }
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 0.5em;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .photo:hover .caption {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="gallery">
    <div class="photo"><img src="d:\OneDrive\Documents\Pictures\image.png" alt="Image 1"><div class="caption">Caption 1</div></div>
    <div class="photo"><img src="d:\OneDrive\Documents\Pictures\Screenshots 1\hee.jpeg" alt="Image 2"><div class="caption">Caption 2</div></div>
    <div class="photo"><img src="d:\OneDrive\Documents\Pictures\Screenshots 1\logo.jpeg" alt="Image 3"><div class="caption">Caption 3</div></div>
    <div class="photo"><img src="d:\OneDrive\Documents\Pictures\Screenshots 1\Screenshot 2024-11-24 130615.png" alt="Image 4"><div class="caption">Caption 4</div></div>
    <div class="photo"><img src="d:\OneDrive\Documents\Pictures\Screenshots 1\Screenshot 2025-08-06 195951.png" alt="Image 5"><div class="caption">Caption 5</div></div>
    <div class="photo"><img src="img6.jpg" alt="Image 6"><div class="caption">Caption 6</div></div>
  </div>
</body>
</html>
