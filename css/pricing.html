    .plan {
      flex: 1;

      padding: 2em;
      border: 2px solid #ccc;

      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: transform 0.3s, background 0.3s;
    }
    .plan:hover {
      transform: scale(1.05);
      background: #e0f7fa;
    }
    .popular {
      border: 2px solid #0077cc;
    }
    a.button {
      display: inline-block;
      padding: 0.5em 1em;
      background: #0077cc;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
