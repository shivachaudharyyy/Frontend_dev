<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Border & Padding Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .box {
      width: 180px;
      height: 120px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.4s ease;
      font-weight: bold;
    }

    .solid {
      border: 4px solid #3498db;
      padding: 10px;
    }

    .dashed {
      border: 4px dashed #e67e22;
      padding: 20px;
    }

    .double {
      border: 6px double #2ecc71;
      padding: 30px;
    }

    .groove {
      border: 6px groove #9b59b6;
      padding: 15px;
    }

    .rounded {
      border: 4px solid #34495e;
      border-radius: 20px;
      padding: 25px;
    }

    .box:hover {
      border-color: #e74c3c;
    }
  </style>
</head>
<body>
  <h1>Border & Padding Demo</h1>
  <div class="container">
    <div class="box solid">Solid Border</div>
    <div class="box dashed">Dashed Border</div>
    <div class="box double">Double Border</div>
    <div class="box groove">Groove Border</div>
    <div class="box rounded">Rounded Corners</div>
  </div>
</body>
</html>
