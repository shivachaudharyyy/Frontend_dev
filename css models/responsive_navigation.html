<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Navigation Bar Demo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      background-color: #2c3e50;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px 0;
      border-bottom: 2px solid #34495e;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      margin: 5px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
      border-radius: 4px;
    }

    nav a:hover {
      background-color: #34495e;
      border-color: #1abc9c;
    }

    nav a.active {
      background-color: #1abc9c;
      border-bottom: 3px solid #16a085;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #ecf0f1;
      margin-top: auto;
      font-size: 0.95em;
      color: #555;
    }

    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: center;
      }

      nav a {
        width: 100%;
        text-align: center;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <main style="padding: 40px; text-align: center;">
    <h1>Welcome to the Navigation Demo</h1>
    <p>Resize the window to see the responsive behavior.</p>
  </main>

  <footer>
    &copy; 2025 Mayank Yadav. All rights reserved.
  </footer>
</body>
</html>
