<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Transformations Showcase</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f4f4;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .box-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .box {
      width: 120px;
      height: 120px;
      background-color: #3498db;
      margin-bottom: 10px;
      transition: all 0.4s ease;
      border-radius: 10px;
    }

    /* Hover transformations */
    .rotate:hover {
      transform: rotate(20deg);
    }

    .scale:hover {
      transform: scale(1.2);
    }

    .translate:hover {
      transform: translateY(-15px);
    }

    .skew:hover {
      transform: skew(15deg, 5deg);
    }

    .label {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>CSS Transformations Showcase</h1>
  <div class="container">
    <div class="box-wrapper">
      <div class="box rotate"></div>
      <div class="label">rotate(20deg)</div>
    </div>
    <div class="box-wrapper">
      <div class="box scale"></div>
      <div class="label">scale(1.2)</div>
    </div>
    <div class="box-wrapper">
      <div class="box translate"></div>
      <div class="label">translateY(-15px)</div>
    </div>
    <div class="box-wrapper">
      <div class="box skew"></div>
      <div class="label">skew(15deg, 5deg)</div>
    </div>
  </div>
</body>
</html>
