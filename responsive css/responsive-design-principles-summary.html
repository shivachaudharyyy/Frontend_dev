<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Design Principles</title>
<link rel="stylesheet" href="responsive-design-principles-summary.css">
</head>
<body>
<main class="principles">
<section class="box">
<h3>Fluid Layouts</h3>
<p>Use percentages and flexible units like <code>vw</code> or <code>fr</code> for adaptability.</p>
<pre>width: 80%;</pre>
</section>
<section class="box">
<h3>Flexible Media</h3>
<p>Ensure images resize using <code>max-width: 100%;</code></p>
<pre>img { max-width: 100%; }</pre>
</section>
<section class="box">
<h3>Breakpoints</h3>
<p>Define changes with <code>@media</code> queries for device widths.</p>
<pre>@media (max-width: 600px) { ... }</pre>
</section>
</main>
</body>
</html>
