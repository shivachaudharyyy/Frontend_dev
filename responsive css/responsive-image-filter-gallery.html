<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
<header>
<h1>Image Filter Gallery</h1>
</header>
<main>
<section class="gallery">
<!-- six images with captions -->
<figure>
<img src="https://picsum.photos/id/1015/800/600" alt="Landscape 1" class="filter-blur">
<figcaption>Blur</figcaption>
</figure>
<figure>
<img src="https://picsum.photos/id/1025/800/600" alt="Landscape 2" class="filter-grayscale">
<figcaption>Grayscale</figcaption>
</figure>
<figure>
<img src="https://picsum.photos/id/1035/800/600" alt="Landscape 3" class="filter-sepia">
<figcaption>Sepia</figcaption>
</figure>
<figure>
<img src="https://picsum.photos/id/1045/800/600" alt="Landscape 4" class="filter-brightness">
<figcaption>Brightness</figcaption>
</figure>
<figure>
<img src="https://picsum.photos/id/1055/800/600" alt="Landscape 5" class="filter-contrast">
<figcaption>Contrast</figcaption>
</figure>
<figure>
<img src="https://picsum.photos/id/1065/800/600" alt="Landscape 6" class="filter-hue">
<figcaption>Hue Rotate</figcaption>
</figure>
</section>
</main>
<footer>
<p>Gallery — responsive example</p>
</footer>
</body>
</html>
